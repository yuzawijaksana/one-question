<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>one question · owl</title>
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#000000">
<style>
/* ─────────────────────────────────────────────────────────
   owl web — vantablack rebuild, modeled on the oma launcher
   widget: menu-first, card boxes, pixel type, lowercase all
   ───────────────────────────────────────────────────────── */
@font-face{
  font-family:"Monocraft";
  src:url("/one/fonts/Monocraft.ttf") format("truetype");
  font-display:swap;
}
:root{
  --bg:#000000;
  --fg:#ececec;
  --muted:#787774;
  --accent:#8d8d8d;
  --red:#ff6b6b;
  --green:#6bd68a;
  --gold:#f5c542;
  --line:rgba(236,236,236,.08);
  --line-strong:rgba(236,236,236,.14);
  --card:rgba(236,236,236,.045);
  --card-hover:rgba(236,236,236,.09);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"Monocraft",ui-monospace,monospace;
  font-weight:300;
  text-transform:lowercase;
  -webkit-font-smoothing:none;
  font-smooth:never;
  overflow-x:hidden;
}
button{
  font-family:inherit;color:inherit;background:none;border:none;
  cursor:pointer;text-transform:lowercase;font-weight:300;
}
input,textarea{
  font-family:inherit;color:var(--fg);background:var(--card);
  border:1px solid var(--line-strong);border-radius:8px;
  padding:10px 12px;font-size:15px;width:100%;outline:none;
  text-transform:lowercase;font-weight:300;
}
input:focus,textarea:focus{border-color:rgba(141,141,141,.5);}
::placeholder{color:var(--muted);opacity:.5;}
a{color:inherit;text-decoration:none;}
img{display:block;}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;}
.view{
  display:none;min-height:100vh;
  padding:20px 18px 60px;
  opacity:0;transform:translateY(14px);
}
.view.on{display:block;animation:fin 260ms cubic-bezier(.22,.9,.3,1) forwards;}
@keyframes fin{to{opacity:1;transform:none;}}
/* ── flash on section open ── */
#flash{
  position:fixed;inset:0;background:var(--fg);opacity:0;
  pointer-events:none;z-index:90;transition:opacity 320ms ease-out;
}
#flash.lit{opacity:.14;transition:none;}
/* ── type scale ── */
.t-title{font-size:24px;font-weight:300;letter-spacing:.5px;}
.t-label{font-size:12px;color:var(--muted);}
.t-small{font-size:11.5px;color:var(--muted);}
.t-accent{color:var(--accent);}
/* ── menu (home) ── */
#v-menu{padding-top:70px;text-align:center;}
#menuClock{font-size:64px;font-weight:300;letter-spacing:2px;line-height:1;}
#menuSub{margin-top:10px;font-size:13px;color:var(--fg);}
#menuWx{margin-top:6px;font-size:13px;color:var(--fg);}
#menuStatus{margin-top:18px;font-size:13px;min-height:18px;}
#menuSholat{
  margin:14px auto 0;max-width:300px;padding:12px 10px;border-radius:14px;
  background:rgba(245,197,66,.06);border:1px solid rgba(245,197,66,.28);
  font-size:13px;color:var(--gold);
}
#menuSholat .t{color:rgba(236,236,236,.5);font-size:11.5px;margin-top:3px;}
#menuSholat .done{
  display:inline-block;margin-top:8px;padding:9px 12px;border-radius:8px;
  background:rgba(236,236,236,.12);border:1px solid rgba(236,236,236,.7);
  color:var(--fg);font-size:12px;
}
#menuList{margin-top:46px;text-align:left;}
.menu-row{
  display:flex;align-items:center;gap:14px;
  padding:15px 13px;font-size:18px;color:var(--fg);
  border-bottom:1px solid var(--line);
}
.menu-row:active{background:var(--card);}
.menu-row .count{margin-left:auto;color:var(--muted);font-size:12px;}
/* ── section top bar ── */
.top{
  display:flex;align-items:center;gap:12px;margin-bottom:18px;
}
.back{
  padding:8px 10px;color:var(--muted);font-size:14px;flex-shrink:0;
}
.back:active{color:var(--fg);}
.top .tt{flex:1;min-width:0;}
.top .tt .t-title{line-height:1.15;}
.top .tt .t-label{margin-top:3px;}
/* ── cards ── */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:24px 20px;
}
.card.tap:active{background:var(--card-hover);}
/* ── pills ── */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
.pill{
  padding:7px 10px;border-radius:8px;font-size:12px;color:var(--muted);
  background:rgba(236,236,236,.05);
}
.pill.on{
  color:var(--accent);background:rgba(141,141,141,.18);
  border:1px solid rgba(141,141,141,.5);padding:6px 9px;
}
/* ── generic rows ── */
.row{
  display:flex;align-items:center;gap:10px;padding:10px 4px;
  border-bottom:1px solid rgba(236,236,236,.05);
}
.row .grow{flex:1;min-width:0;}
.row .del{color:rgba(255,107,107,.5);padding:6px 8px;flex-shrink:0;}
.row .del:active{color:var(--red);}
.addrow{
  margin-top:14px;color:var(--accent);font-size:14px;padding:10px 4px;
  text-align:center;
}
.addrow:active{color:var(--fg);}
.center{text-align:center;}
.spacer{height:22px;}
/* ── nav arrows (quotes) ── */
.navrow{display:flex;justify-content:center;gap:20px;margin-top:16px;}
.navrow button{padding:10px 18px;color:var(--muted);font-size:16px;}
.navrow button:active{color:var(--fg);}
/* ── deadline urgency ── */
.dl-date{font-size:26px;}
.dl-date.red{color:var(--red);}
.dl-date.gold{color:var(--gold);}
.dl-date.acc{color:var(--accent);}
.dl-note{
  margin-top:10px;padding:10px 12px;border-radius:10px;
  background:rgba(236,236,236,.04);font-size:13px;color:rgba(236,236,236,.85);
  white-space:pre-wrap;word-break:break-word;
}
.checkbox{
  width:20px;height:20px;border-radius:6px;flex-shrink:0;
  border:1px solid rgba(236,236,236,.4);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.checkbox.on{background:rgba(141,141,141,.85);border-color:transparent;}
.checkbox .tick{color:#000;font-size:13px;display:none;}
.checkbox.on .tick{display:block;}
.done-text{color:rgba(120,119,116,.5);text-decoration:line-through;}
/* ── day circle blocks ── */
.sched-row{display:flex;align-items:center;gap:10px;padding:10px 4px;}
.sched-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sched-block{
  border-left:3px solid var(--accent);padding:10px 12px;margin-bottom:8px;
  background:rgba(236,236,236,.03);border-radius:0 10px 10px 0;
}
.sched-block.active{background:rgba(236,236,236,.07);}
.sched-block .t2{font-size:11.5px;color:var(--muted);margin-top:3px;}
.tabs{display:flex;gap:8px;margin-bottom:14px;}
.tabs button{
  padding:8px 14px;border-radius:8px;font-size:12px;color:var(--muted);
  background:rgba(236,236,236,.05);
}
.tabs button.on{color:var(--accent);background:rgba(141,141,141,.18);border:1px solid rgba(141,141,141,.5);}
/* ── guide steps ── */
.gstep{
  display:flex;align-items:flex-start;gap:12px;padding:10px 4px;
  border-bottom:1px solid rgba(236,236,236,.05);
}
.gstep .txt{flex:1;font-size:14px;line-height:1.5;padding-top:1px;}
.gchoices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.gchoice{
  font-size:11px;color:var(--muted);padding:5px 8px;border-radius:7px;
  background:rgba(236,236,236,.05);
}
.gchoice.picked{color:var(--accent);background:rgba(141,141,141,.18);}
/* ── sync dot ── */
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;}
.syncdot.ok{background:var(--green);}
.syncdot.bad{background:var(--red);}
/* ── modal ── */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:120;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal.open{display:flex;}
.modal-box{
  background:#0a0a0a;border:1px solid var(--line-strong);border-radius:16px;
  width:100%;max-width:420px;padding:20px;max-height:82vh;overflow-y:auto;
}
.modal-box h3{font-size:16px;font-weight:300;margin-bottom:14px;color:var(--fg);}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.modal-actions button{
  flex:1;padding:12px;border-radius:10px;font-size:14px;
  background:var(--card);border:1px solid var(--line-strong);
}
.modal-actions button.primary{background:rgba(141,141,141,.25);border-color:rgba(141,141,141,.5);}
/* ── toast ── */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#111;border:1px solid var(--line-strong);border-radius:10px;
  padding:10px 16px;font-size:12.5px;color:var(--fg);opacity:0;
  transition:all 240ms;z-index:140;pointer-events:none;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* ── sync pill ── */
#syncpill{
  position:fixed;top:10px;right:12px;z-index:60;font-size:11px;color:var(--muted);
}
#syncpill .syncdot{width:6px;height:6px;}
@media(min-width:700px){
  #app{max-width:560px;border-left:1px solid var(--line);border-right:1px solid var(--line);}
  #menuClock{font-size:80px;}
}
</style>
</head>
<body>
<div id="flash"></div>
<div id="syncpill"><span class="syncdot bad" id="syncDot"></span><span id="syncTxt">connecting…</span></div>
<div id="app">

  <!-- ═══════ MENU ═══════ -->
  <div class="view on" id="v-menu">
    <div id="menuClock">--:--</div>
    <div id="menuSub"></div>
    <div id="menuWx"></div>
    <div id="menuStatus"></div>
    <div id="menuSholat" style="display:none"></div>
    <div id="menuList"></div>
  </div>

  <!-- ═══════ QUOTES ═══════ -->
  <div class="view" id="v-quotes">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">quiet feed</div><div class="t-label" id="qtCount"></div></div></div>
    <div class="spacer"></div>
    <div class="card tap" id="qtCard" style="text-align:left;">
      <div id="qtText" style="font-size:19px;line-height:1.6;font-style:italic;"></div>
      <div style="display:flex;margin-top:20px;align-items:center;">
        <button class="del" id="qtDel" style="font-size:12px;">✕</button>
        <div style="flex:1;"></div>
        <div class="t-accent" id="qtAuthor" style="font-size:13px;"></div>
      </div>
    </div>
    <div class="navrow">
      <button id="qtPrev">↑</button><button id="qtNext">↓</button>
    </div>
    <div class="spacer"></div>
    <button class="addrow" id="qtAdd" style="width:100%;">+ add quote</button>
  </div>

  <!-- ═══════ REMEMBER (stickies) ═══════ -->
  <div class="view" id="v-stickies">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">remember wall</div><div class="t-label" id="stCount"></div></div></div>
    <div class="pills" id="stPills"></div>
    <div class="spacer"></div>
    <div class="card tap" id="stCard">
      <div id="stText" style="font-size:17px;line-height:1.6;"></div>
      <div style="display:flex;gap:10px;margin-top:18px;align-items:center;">
        <span class="checkbox" id="stToggle"><span class="tick">✓</span></span>
        <span id="stCat" class="t-label" style="flex:1;"></span>
        <button class="del" id="stDel">✕</button>
      </div>
    </div>
    <div class="navrow"><button id="stPrev">↑</button><button id="stNext">↓</button></div>
    <div class="spacer"></div>
    <button class="addrow" id="stAdd" style="width:100%;">+ add sticky</button>
  </div>

  <!-- ═══════ DAY CIRCLE (schedule) ═══════ -->
  <div class="view" id="v-sched">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">day circle</div><div class="t-label" id="scCount"></div></div></div>
    <div class="tabs">
      <button id="scTabActs" class="on">acts</button>
      <button id="scTabSholat">sholat</button>
    </div>
    <div id="scActs"></div>
    <div id="scSholat" style="display:none;"></div>
    <button class="addrow" id="scAdd" style="width:100%;">+ add block</button>
  </div>

  <!-- ═══════ DEADLINES ═══════ -->
  <div class="view" id="v-deadlines">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">deadlines</div><div class="t-label" id="dlCount"></div></div></div>
    <div id="dlList"></div>
    <button class="addrow" id="dlAdd" style="width:100%;">+ add deadline</button>
  </div>

  <!-- ═══════ JOURNAL ═══════ -->
  <div class="view" id="v-journal">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">journal</div><div class="t-label" id="jCount"></div></div></div>
    <div id="jList"></div>
    <button class="addrow" id="jAdd" style="width:100%;">+ new chapter</button>
  </div>

  <!-- ═══════ DAILY GUIDE ═══════ -->
  <div class="view" id="v-guide">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">daily guide</div><div class="t-label" id="gCount"></div></div></div>
    <div id="gList"></div>
    <button class="addrow" id="gAdd" style="width:100%;">+ new guide</button>
  </div>

  <!-- ═══════ SETTINGS ═══════ -->
  <div class="view" id="v-settings">
    <div class="top"><button class="back" data-go="menu">‹ back</button>
      <div class="tt"><div class="t-title">settings</div><div class="t-label">one question · owl web</div></div></div>
    <div class="row"><span class="syncdot" id="syncDot2" style="position:static;"></span><span class="t-label" id="syncTxt2" style="flex:1;">connecting…</span></div>
    <div class="card" style="margin-top:14px;">
      <div class="t-label" style="margin-bottom:10px;">sholat location</div>
      <div style="display:flex;gap:8px;">
        <input id="setLat" placeholder="latitude" inputmode="decimal">
        <input id="setLon" placeholder="longitude" inputmode="decimal">
      </div>
      <button class="addrow" id="setSaveLoc" style="width:100%;">save location</button>
    </div>
    <div class="card" style="margin-top:14px;">
      <div class="t-label">the old web app lives at <a href="/one/" style="color:var(--accent);text-decoration:underline;">/one/</a> · this owl build reads and writes the same server data</div>
    </div>
  </div>
</div>

<!-- modals -->
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ═══════════════ owl web — one file, no build step ═══════════════
   reads/writes the same /api/state as the phone widget + old web app */

const API="/one/api/state";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=(n,w=2)=>String(n).padStart(w,"0");
let KEYS={},online=false;

/* ── state sync ── */
const MUT={};   // key -> value, dirty
let syncTimer=null,uiState={qt:0,st:0,cat:"all",g:null,sc:"acts"};

async function pull(){
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(!r.ok)throw 0;
    const d=await r.json();
    KEYS={};for(const[k,v]of Object.entries(d.keys||{}))KEYS[k]=v.value;
    online=true;setSync();renderAll();
  }catch(e){online=false;setSync();}
}
async function push(){
  const changes={};
  for(const[k,v]of Object.entries(MUT))changes[k]={value:v,updatedAt:Date.now()};
  if(!Object.keys(changes).length)return true;
  try{
    const r=await fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({changes})});
    if(!r.ok)throw 0;
    for(const k in MUT)KEYS[k]=MUT[k];
    for(const k in MUT)delete MUT[k];
    online=true;setSync();return true;
  }catch(e){online=false;setSync();return false;}
}
function set(k,v){MUT[k]=v;renderAll();clearTimeout(syncTimer);syncTimer=setTimeout(async()=>{
  const ok=await push();if(!ok)toast("offline — will retry");
  else{KEYS=KEYS;renderAll();}
},250);}
function setSync(){
  const c=online?"ok":"bad",t=online?"online · synced":"offline";
  for(const[id,tx]of[["syncDot",null],["syncDot2",null]])
    $(id)&&( $(id).className="syncdot "+c );
  $("syncTxt").textContent=t;$("syncTxt2").textContent=t;
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}

/* ── accessors ── */
const get=k=>MUT[k]!==undefined?MUT[k]:(KEYS[k]!==undefined?KEYS[k]:[]);
const uid=()=>Math.random().toString(36).slice(2,10);

/* ── navigation ── */
let cur="menu";
const VIEWS=["menu","quotes","stickies","sched","deadlines","journal","guide","settings"];
function go(v){
  if(v===cur&&v!=="menu")return;
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
  const el=$("v-"+v);
  el.classList.add("on");
  el.style.animation="none";el.offsetHeight;el.style.animation="";
  cur=v;
  const f=$("flash");f.classList.add("lit");
  requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("lit")));
  window.scrollTo(0,0);
  if(v==="menu")renderMenu();
}
document.body.addEventListener("click",e=>{
  const b=e.target.closest("[data-go]");
  if(b)go(b.dataset.go);
});

/* ═══════ MENU ═══════ */
const SECTIONS=[
  ["quotes","quiet feed",()=>get("oneQuestionQuotes").length],
  ["stickies","remember",()=>get("oneQuestionStickies").length],
  ["sched","day circle",()=>get("oneQuestionSchedule").length],
  ["deadlines","deadlines",()=>get("oneQuestionDeadlines").filter(d=>!d.done).length+" open"],
  ["journal","journal",()=>get("oneQuestionJournal").length],
  ["guide","daily guide",()=>guides().length],
  ["settings","settings",""],
];
function guides(){return get("oneQuestionSettings").widgetGuides||[];}
function renderMenu(){
  const n=new Date();
  $("menuClock").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
  $("menuSub").textContent=n.toLocaleDateString("en",{weekday:"short",month:"short",day:"numeric"});
  $("menuList").innerHTML=SECTIONS.map(([v,l,c])=>
    `<div class="menu-row" data-go="${v}">${l}<span class="count">${typeof c=="function"?c():c}</span></div>`).join("");
  // day circle status
  const sched=get("oneQuestionSchedule");
  const mn=n.getHours()*60+n.getMinutes();
  const act=sched.find(b=>mn>=b.start&&mn<b.end);
  $("menuStatus").innerHTML=act
    ?`<span style="color:${esc(act.color||"var(--green)")}">● ${esc(act.label)} · ends ${pad(Math.floor(act.end/60))}:${pad(act.end%60)}</span>`
    :"";
  renderSholat(n);
  renderWx();
}
/* sholat: computed from coords in settings (no external API needed offline) */
function renderSholat(n){
  const box=$("menuSholat");
  const s=get("oneQuestionSholat");
  const today=n.toISOString().slice(0,10);
  if(!s||s.date!==today||!s.times){box.style.display="none";return;}
  const mn=n.getHours()*60+n.getMinutes();
  const T=s.times,B=s.bounds||{};
  const list=[["subuh",T.subuh,B.subuh||T.dzuhur],["dzuhur",T.dzuhur,B.dzuhur||T.ashar],
    ["ashar",T.ashar,B.ashar||T.maghrib],["maghrib",T.maghrib,B.maghrib||T.isya],
    ["isya",T.isya,[T.isya[0],T.isya[1]+15]]];
  const act=list.find(([k,t,e])=>mn>=t[0]*60+t[1]&&mn<e[0]*60+e[1]);
  const next=list.find(([k,t])=>t[0]*60+t[1]>mn)||list[0];
  const show=act||next;
  const fmt=t=>pad(t[0])+":"+pad(t[1]);
  const doneKey=(s.done||{})[show[0]]===today;
  if(act&&!doneKey){
    box.style.display="block";
    box.innerHTML=`${act[0]} · ${fmt(act[1])} - ${fmt(act[2])}<div class="t">${act[1][0]*60+act[1][1]>mn?"in progress":"ends"} window</div>
      <button class="done" id="shDone">✓ sudah sholat</button>`;
    $("shDone").onclick=()=>{markSholat(act[0]);};
  }else{
    box.style.display="block";
    box.innerHTML=`${show[0]}<div class="t">${fmt(show[1])} - ${fmt(show[2])}</div>`;
  }
}
function markSholat(key){
  const s=get("oneQuestionSholat");
  const today=new Date().toISOString().slice(0,10);
  s.done=s.done||{};s.done[key]=today;
  set("oneQuestionSholat",s);toast("✓ "+key);
}
/* weather: wttr.in, cached */
let wxT=null;
function renderWx(){
  if(wxT){$("menuWx").textContent=wxT;return;}

/* ═══════ QUOTES ═══════ */
let qtI=0;
function renderQuotes(){
  const q=get("oneQuestionQuotes");
  $("qtCount").textContent=q.length+" quotes";
  if(!q.length){$("qtText").textContent="no quotes yet";$("qtAuthor").textContent="";return;}
  qtI=((qtI%q.length)+q.length)%q.length;
  const c=q[qtI];
  $("qtText").textContent="“"+c.text+"”";
  $("qtAuthor").textContent="— "+(c.author||"unknown");
}
$("qtCard").onclick=e=>{if(e.target.id!="qtDel"){qtI++;renderQuotes();}};
$("qtPrev").onclick=()=>{qtI--;renderQuotes();};
$("qtNext").onclick=()=>{qtI++;renderQuotes();};
$("qtAdd").onclick=()=>modal(`<h3>+ add quote</h3>

$("qtDel").onclick=()=>{
  const q=get("oneQuestionQuotes");if(!q.length)return;

  confirmDel(c.text,()=>{q.splice(qtI,1);qtI=0;set("oneQuestionQuotes",q);});
};

/* ═══════ STICKIES ═══════ */
function renderStickies(){
  const s=get("oneQuestionStickies");
  const done=s.filter(x=>x.done).length;
  $("stCount").textContent=done+" done · "+(s.length-done)+" open";
  const cats=[...new Set(["all",...s.map(x=>x.cat||"general")])];
  $("stPills").innerHTML=cats.map(c=>
    `<button class="pill${uiState.cat===c?" on":""}" data-cat="${esc(c)}">${c==="all"?"all":"#"+esc(c)}</button>`).join("");
  $("stPills").onclick=e=>{
    const p=e.target.closest("[data-cat]");if(!p)return;
    uiState.cat=p.dataset.cat;renderStickies();
  };
  const list=uiState.cat==="all"?s:s.filter(x=>(x.cat||"general")===uiState.cat);
  if(!list.length){
    $("stText").textContent="nothing here yet";$("stCat").textContent="";$("stCard").classList.add("center");
    return;
  }
  $("stCard").classList.remove("center");
  uiState.st=((uiState.st%list.length)+list.length)%list.length;
  const c=list[uiState.st];
  $("stText").textContent=c.text;
  $("stText").className=c.done?"done-text":"";
  $("stCat").textContent="#"+(c.cat||"general")+(c.done?" · done":"");
  $("stToggle").className="checkbox"+(c.done?" on":"");
}
$("stCard").onclick=e=>{
  if(e.target.closest("#stToggle")||e.target.closest("#stDel"))return;
  uiState.st++;renderStickies();
};
$("stToggle").onclick=()=>{
  const s=get("oneQuestionStickies");
  const list=uiState.cat==="all"?s:s.filter(x=>(x.cat||"general")===uiState.cat);
  const c=list[uiState.st];if(!c)return;
  c.done=!c.done;set("oneQuestionStickies",s);toast(c.done?"done":"reopened");
};
$("stPrev").onclick=()=>{uiState.st--;renderStickies();};
$("stNext").onclick=()=>{uiState.st++;renderStickies();};
$("stDel").onclick=()=>{
  const s=get("oneQuestionStickies");
  const list=uiState.cat==="all"?s:s.filter(x=>(x.cat||"general")===uiState.cat);
  const c=list[uiState.st];if(!c)return;
  confirmDel(c.text,()=>{set("oneQuestionStickies",s.filter(x=>x.id!==c.id));});
};
$("stAdd").onclick=()=>modal(`<h3>+ add sticky</h3>
  <textarea id="mS" rows="2" placeholder="remember…"></textarea><div style="height:10px"></div>
  <input id="mC" placeholder="category (general)" value="general">
  <div class="modal-actions"><button data-close>cancel</button><button class="primary" id="mSave">add</button></div>`,
  ()=>{$("mSave").onclick=()=>{
    const t=$("mS").value.trim();if(!t)return;
    const s=get("oneQuestionStickies");
    s.push({id:uid(),text:t,cat:$("mC").value.trim()||"general",done:false,created:Date.now()});
    set("oneQuestionStickies",s);closeModal();toast("added");

/* ═══════ DEADLINES ═══════ */
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function daysLeft(d){
  if(!d)return null;
  const due=new Date(d+"T23:59:59"),now=new Date();
  return Math.ceil((due-now)/86400000);
}
function renderDeadlines(){
  const dl=get("oneQuestionDeadlines");
  const open=dl.filter(d=>!d.done).length;
  $("dlCount").textContent=open+" open";
  // flatten parents with progress, grouped by date — controls.owl style
  const dated=dl.filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date));
  const nodate=dl.filter(d=>!d.date);
  const dates=[...new Set(dated.map(d=>d.date))];
  let h="";
  for(const dt of dates){
    const items=dated.filter(d=>d.date===dt);
    const left=daysLeft(dt);
    const cls=left<0?"red":left===0?"gold":"acc";
    const[_,m,d]=dt.split("-");
    h+=`<div style="margin-top:14px;">
      <div style="display:flex;align-items:baseline;gap:8px;padding:6px 4px 2px;">
        <span class="dl-date ${cls}">${+d}</span><span class="t-label">${MONTHS[+m-1]}</span></div>`;
    for(const it of items)h+=dlRow(it);
    h+="</div>";
  }
  if(nodate.length){
    h+='<div style="margin-top:14px;"><div class="t-label" style="padding:6px 4px;">no date</div>';
    for(const it of nodate)h+=dlRow(it);
    h+="</div>";
  }
  $("dlList").innerHTML=h||'<div class="t-label center">nothing due — enjoy it</div>';
  $("dlList").onclick=e=>{
    const row=e.target.closest("[data-dlid]");
    if(row)openDl(row.dataset.dlid);
  };
}
function dlRow(it){
  const kids=it.children||[];
  const dn=kids.filter(k=>k.done).length;
  const sub=kids.length?`${dn}/${kids.length} done`:"";
  const time=it.time?(" · "+it.time):"";
  return `<div class="row" data-dlid="${it.id}" style="cursor:pointer;">
    <span class="grow${it.done?" done-text":""}" style="font-size:14px;">${esc(it.title)}
      ${sub||time?`<span class="t-label" style="display:block;margin-top:2px;">${sub}${time}</span>`:""}</span>
    <span style="color:var(--muted);">›</span></div>`;
}
function findDl(list,id,par=null){
  for(const it of list){
    if(it.id===id)return{it,par};
    const r=findDl(it.children||[],id,it);
    if(r)return r;
  }
  return null;
}
function openDl(id){
  const dl=get("oneQuestionDeadlines");
  const r=findDl(dl,id);
  if(!r)return;
  const{it,par}=r;
  const kids=it.children||[];
  const dn=kids.filter(k=>k.done).length;
  const left=daysLeft(it.date);
  const leftTxt=it.date?(left<0?`<span style="color:var(--red)">${-left}d overdue</span>`
    :left===0?`<span style="color:var(--gold)">today</span>`
    :`in ${left}d`):"no date";
  modal(`<button class="back" id="mBack" style="margin-bottom:12px;">‹ ${par?esc(par.title):"deadlines"}</button>
    <div style="display:flex;gap:12px;align-items:center;">
      <span class="checkbox${it.done?" on":""}${kids.length?" locked":""}" id="mChk"><span class="tick">✓</span></span>
      <span style="font-size:17px;${it.done?"done-text":""}" class="${it.done?"done-text":""}">${esc(it.title)}</span></div>
    <div class="dl-note" style="margin-top:14px;">
      <div class="row" style="border:none;padding:4px 0;"><span class="t-label" style="flex:1;">due date</span><span style="font-size:13px;">${it.date||"no date"}${it.time?" "+it.time:""}</span></div>
      ${it.date?`<div class="row" style="border:none;padding:4px 0;"><span class="t-label" style="flex:1;">left</span>${leftTxt}</div>`:""}
      ${kids.length?`<div class="row" style="border:none;padding:4px 0;"><span class="t-label" style="flex:1;">subtasks</span><span style="font-size:13px;">${dn}/${kids.length} done</span></div>`:""}
    </div>
    ${it.note?`<div class="dl-note">${esc(it.note)}</div>`:""}
    ${kids.length?`<div style="margin-top:14px;">${kids.map(k=>`
      <div class="gstep"><span class="checkbox${k.done?" on":""}" data-kid="${k.id}"><span class="tick">✓</span></span>
      <span class="txt${k.done?" done-text":""}">${esc(k.title)}</span>
      <button class="del" data-kdel="${k.id}">✕</button></div>`).join("")}</div>`:""}
    <div class="modal-actions"><button id="mNote">note</button><button id="mDel" style="color:var(--red);">delete</button></div>`,
    ()=>{
      $("mBack").onclick=closeModal;
      $("mChk").onclick=()=>{
        if(kids.length){toast("finish the subtasks first");return;}
        it.done=!it.done;set("oneQuestionDeadlines",dl);closeModal();
      };
      $("modalBox").querySelectorAll("[data-kid]").forEach(el=>{
        el.onclick=()=>{
          const k=kids.find(x=>x.id===el.dataset.kid);
          k.done=!k.done;set("oneQuestionDeadlines",dl);closeModal();openDl(id);
        };
      });
      $("modalBox").querySelectorAll("[data-kdel]").forEach(el=>{
        el.onclick=()=>{
          it.children=kids.filter(x=>x.id!==el.dataset.kdel);
          set("oneQuestionDeadlines",dl);closeModal();openDl(id);
        };
      });
      $("mNote").onclick=()=>{
        modal(`<h3>note — ${esc(it.title)}</h3>
          <textarea id="mN" rows="5">${esc(it.note||"")}</textarea>
          <div class="modal-actions"><button data-close>cancel</button><button class="primary" id="mSaveN">save</button></div>`,
          ()=>{$("mSaveN").onclick=()=>{it.note=$("mN").value;set("oneQuestionDeadlines",dl);closeModal();openDl(id);};});
      };
      $("mDel").onclick=()=>{
        if(par){par.children=par.children.filter(x=>x.id!==it.id);}
        else{const i=dl.indexOf(it);if(i>=0)dl.splice(i,1);}
        set("oneQuestionDeadlines",dl);closeModal();
      };
    });
}

/* ═══════ DAILY GUIDE ═══════ */
function renderGuide(){
  const g=guides();
  $("gCount").textContent=g.length+" guides";
  if(uiState.g){
    const cur=g.find(x=>x.id===uiState.g);
    if(cur){renderGuidePage(cur);return;}
    uiState.g=null;
  }
  $("gList").innerHTML=g.map(x=>{
    const dn=(x.steps||[]).filter(s=>s.done).length;
    return `<div class="row" data-gid="${x.id}" style="cursor:pointer;">
      <span class="grow"><span style="font-size:14px;">${esc(x.title)}</span>
      <span class="t-label" style="display:block;margin-top:2px;">${dn}/${(x.steps||[]).length} done</span></span>
      <button class="del" data-gdel="${x.id}">✕</button></div>`;}).join("")
    ||'<div class="t-label center">no guides yet</div>';
  $("gList").onclick=e=>{
    const del=e.target.closest("[data-gdel]");
    if(del){
      confirmDel("this guide",()=>{set("oneQuestionSettings",{...get("oneQuestionSettings"),widgetGuides:guides().filter(x=>x.id!==del.dataset.gdel)});});
      return;
    }
    const row=e.target.closest("[data-gid]");
    if(row){uiState.g=row.dataset.gid;renderGuide();}
  };
}
function renderGuidePage(cur){
  const dn=(cur.steps||[]).filter(s=>s.done).length;
  $("gList").innerHTML=`
    <button class="back" id="gBack" style="margin-bottom:14px;">‹ all guides</button>
    <div class="t-title" style="margin-bottom:4px;">${esc(cur.title)}</div>
    <div class="t-label" style="margin-bottom:12px;">${dn}/${(cur.steps||[]).length} done ${dn&&(dn===(cur.steps||[]).length)?"· complete ✓":""}</div>
    ${(cur.steps||[]).map(s=>`
      <div class="gstep">
        <span class="checkbox${s.done?" on":""}" data-sid="${s.id}"><span class="tick">✓</span></span>
        <div class="txt">
          <div class="${s.done?"done-text":""}">${esc(s.text)}</div>
          ${(s.choices||[]).length?`<div class="gchoices">${s.choices.map(c=>
            `<button class="gchoice${s.pick===c?" picked":""}" data-pick="${s.id}|${esc(c)}">${esc(c)}</button>`).join("")}</div>`:""}
        </div>
        <button class="del" data-sdel="${s.id}">✕</button>
      </div>`).join("")}
    <button class="addrow" id="gStepAdd" style="width:100%;">+ add step</button>`;
  $("gBack").onclick=()=>{uiState.g=null;renderGuide();};
  $("gList").querySelectorAll("[data-sid]").forEach(el=>{
    el.onclick=()=>{
      const s=cur.steps.find(x=>x.id===el.dataset.sid);
      s.done=!s.done;saveGuides(g);
    };
  });
  $("gList").querySelectorAll("[data-pick]").forEach(el=>{
    el.onclick=()=>{
      const[sid,c]=el.dataset.pick.split("|");
      const s=cur.steps.find(x=>x.id===sid);
      s.pick=s.pick===c?null:c;saveGuides(g);
    };
  });
  $("gList").querySelectorAll("[data-sdel]").forEach(el=>{
    el.onclick=()=>{
      cur.steps=cur.steps.filter(x=>x.id!==el.dataset.sdel);saveGuides(g);
    };
  });
  $("gStepAdd").onclick=()=>modal(`<h3>+ add step</h3>
    <textarea id="mSt" rows="2" placeholder="step"></textarea><div style="height:8px"></div>
    <input id="mCh" placeholder="choices (comma separated, optional)">
    <div class="modal-actions"><button data-close>cancel</button><button class="primary" id="mSave">add</button></div>`,
    ()=>{$("mSave").onclick=()=>{
      const t=$("mSt").value.trim();if(!t)return;
      cur.steps.push({id:uid(),text:t,done:false,
        choices:$("mCh").value.split(",").map(x=>x.trim()).filter(Boolean)});
      saveGuides(g);
    };});
}

/* ═══════ modal helpers ═══════ */
function modal(html,after){
  $("modalBox").innerHTML=html;
  $("modal").classList.add("open");
  $("modalBox").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  $("modal").onclick=e=>{if(e.target===$("modal"))closeModal();};
  if(after)after();
}
function closeModal(){$("modal").classList.remove("open");}
function confirmDel(name,fn){
  modal(`<h3 style="color:var(--red);">delete?</h3>
    <div class="t-label" style="font-size:13px;color:var(--fg);">${esc(name)}</div>
    <div class="modal-actions"><button data-close>cancel</button><button id="mYes" style="color:var(--red);background:rgba(255,107,107,.08);border-color:rgba(255,107,107,.3);">delete</button></div>`,
    ()=>{$("mYes").onclick=()=>{closeModal();fn();};});
}

/* ═══════ SETTINGS ═══════ */
function loadSet(){
  const s=get("oneQuestionSholat");
  $("setLat").value=s.lat??"";$("setLon").value=s.lon??"";
}
$("setSaveLoc").onclick=()=>{
  const lat=parseFloat($("setLat").value),lon=parseFloat($("setLon").value);
  if(isNaN(lat)||isNaN(lon)){toast("numbers please");return;}
  const s=get("oneQuestionSholat");
  s.lat=lat;s.lon=lon;
  // quick offline sholat estimate (rough solar calc) — refreshed by real calc later
  s.date="";set("oneQuestionSholat",s);toast("saved — times refresh on next menu open");
};

/* ═══════ boot ═══════ */
function renderAll(){
  renderMenu();
  renderQuotes();renderStickies();renderSched();renderDeadlines();
  renderJournal();renderGuide();loadSet();scTabs();
}
setInterval(()=>{if(cur==="menu")renderMenu();},15000);
pull();
setInterval(pull,30000);
</script>
</body>
</html>
